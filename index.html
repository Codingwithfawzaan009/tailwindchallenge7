<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./dist/output.css" rel="stylesheet" />
</head>
<body class="bg-indigo-50">
    <section class="bg-white shadow-lg rounded-r-xl flex  w-200 h-130 mx-auto mt-18">

        <!--Result Card-->
        <div class="bg-blue-700 w-100 rounded-xl flex flex-col items-center  ">
            <h1 class="text-3xl font-semibold text-indigo-200 mt-15">Your Result</h1>
            <div class="bg-linear-to-b from-[#4A1FBF]/70 to-[#4A2DD6]/70 w-45 h-45 rounded-full  flex flex-col items-center justify-center mt-3 mb-2">
                <h1 class="text-6xl text-white font-bold">76</h1>
                <p class="text-[18px] text-indigo-200 mt-2">of 100</p>
            </div>
            <h1 class="text-3xl text-indigo-200 font-medium mt">Great</h1>
            <p class="text-[18px] text-indigo-200 text-center mt-3 ">You scored higher than 65% of <br>the people who have taken <br>these tests.</p>
        </div>

        <!--Summary-->
        <div class="">
            <h1 class="font-hanken ml-8 mt-15 font-medium text-3xl">Summary</h1>
            <div class="bg-red-50 ml-5 flex gap-2 py-4 px-6 rounded-xl mt-3">
                <img src="images/challenge6reaction.png" class="h-6 w-6 mt-2">
                <h1 class="text-red-400 pr-19 font-bold text-[22px] mt-">Reaction</h1>
                <p class="font-semibold text-xl">80 <span class="text-indigo-200 font-semibold text-xl"> / 100</span></p>
            </div>
            <div class="bg-amber-50 ml-5 flex gap-2 py-4 px-6 rounded-xl mt-3">
                <img src="images/challenge6memory.webp" class="h-6 w-6 mt-2">
                <h1 class="	text-amber-400 pr-19 font-bold text-[22px] mt-">Memory</h1>
                <p class="font-semibold text-xl">80 <span class="text-indigo-200 font-semibold text-xl"> / 100</span></p>
            </div>
            <div class="bg-emerald-50 ml-5 flex gap-2 py-4 px-6 rounded-xl mt-3">
                <img src="images/challenge6verbal.png" class="h-8 w-8  bg-emerald-50">
                <h1 class="text-emerald-500 pr-23 font-bold text-[22px] mt-">Verbal</h1>
                <p class="font-semibold text-xl">80 <span class="text-indigo-200 font-semibold text-xl"> / 100</span></p>
            </div>
            <div class="bg-indigo-100 ml-5 flex gap-2 py-4 px-6 rounded-xl mt-3 mb-10">
                <img src="images/challenge6visual.png" class="h-8 w-8 ">
                <h1 class="text-indigo-700 pr-24 font-bold text-[22px] mt-">Visual</h1>
                <p class="font-semibold text-xl">80 <span class="text-indigo-200 font-semibold text-xl"> / 100</span></p>
            </div>
            <a href="" class="ml-5 bg-slate-700 text-white rounded-full text-center font-semibold text-xl py-3 px-32  hover:bg-linear-to-b hover:from-[#4D21CB] hover:to-[#3129E5]">Continue</a>
        </div>
    </section>

    
</body>
</html>
